name: Pinact

on:
  workflow_call:

# Permissions should be configured at the job level.
permissions: {}

jobs:
  pinact:
    permissions:
      contents: read # To clone the repo.

    name: 'Run Pinact'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # See: https://github.com/suzuki-shunsuke/pinact/blob/main/docs/config.md
      - name: Check for existence of a pinact config file
        id: has_config
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          files: ".pinact.y*ml"

      # See: https://github.com/suzuki-shunsuke/pinact/blob/main/README.md
      # See: https://github.com/suzuki-shunsuke/pinact/blob/main/docs/codes/001.md
      - name: Verify action runners are pinned
        if: ${{ steps.has_config.outputs.files_exists == 'true' }}
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          skip_push: "true"
          fix: "false"
          verify: "true" # = verify trailing version comments
          verify_min_age: "true" # verify cooldown period
          review: ${{ github.event_name == 'pull_request' }}
          reviewdog_level: "error"
